# Generated by Scripts/build_configs.py. Copy this template before editing.
# Replace REPLACE_WITH_JMS_CLASH_SUBSCRIPTION_URL only on your device.
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  nameserver:
  - https://223.5.5.5/dns-query
  - https://1.12.12.12/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - time.*.com
  - ntp.*.com
proxy-providers:
  JMS:
    type: http
    url: "REPLACE_WITH_JMS_CLASH_SUBSCRIPTION_URL"
    path: ./proxy_provider/jms.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
proxy-groups:
- name: 📈 美股交易
  type: select
  use:
  - JMS
- name: 🤖 AI
  type: select
  use:
  - JMS
  proxies:
  - DIRECT
- name: 💻 GitHub
  type: select
  use:
  - JMS
  proxies:
  - DIRECT
- name: 🌍 Google
  type: select
  use:
  - JMS
  proxies:
  - DIRECT
- name: 📺 媒体
  type: select
  use:
  - JMS
  proxies:
  - DIRECT
- name: 🚀 通用代理
  type: select
  use:
  - JMS
  proxies:
  - DIRECT
